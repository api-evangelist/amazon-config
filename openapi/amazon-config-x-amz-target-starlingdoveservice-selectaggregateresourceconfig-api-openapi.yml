    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: SelectAggregateResourceConfig
      description: 'Accepts a structured query language (SQL) SELECT command and an aggregator to query configuration state of Amazon Web Services resources across multiple accounts and regions, performs the corresponding search, and returns resource configurations matching the properties.


        For more information about query components, see the Query Components section in the Config Developer Guide.


        If you run an aggregation query (i.e., using GROUP BY or using aggregate functions such as COUNT; e.g., SELECT resourceId, COUNT(*) WHERE resourceType = ''AWS::IAM::Role'' GROUP BY resourceId) and do not specify the MaxResults or the Limit query parameters, the default page size is set to 500.


        If you run a non-aggregation query (i.e., not using GROUP BY or aggregate function; e.g., SELECT * WHERE resourceType = ''AWS::IAM::Role'') and do not specify the MaxResults or the Limit query parameters, the default page size is set to 25.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectAggregateResourceConfigResponse'
              examples:
                SelectAggregateResourceConfig200Example:
                  summary: Default SelectAggregateResourceConfig 200
                  x-microcks-default: true
                  value:
                    Results: example
                    QueryInfo:
                      SelectFields: {}
                    NextToken: example
        '480':
          description: InvalidExpressionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidExpressionException'
              examples:
                SelectAggregateResourceConfig480Example:
                  summary: Default SelectAggregateResourceConfig 480
                  x-microcks-default: true
                  value: example
        '481':
          description: NoSuchConfigurationAggregatorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoSuchConfigurationAggregatorException'
              examples:
                SelectAggregateResourceConfig481Example:
                  summary: Default SelectAggregateResourceConfig 481
                  x-microcks-default: true
                  value: example
        '482':
          description: InvalidLimitException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidLimitException'
              examples:
                SelectAggregateResourceConfig482Example:
                  summary: Default SelectAggregateResourceConfig 482
                  x-microcks-default: true
                  value: example
        '483':
          description: InvalidNextTokenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidNextTokenException'
              examples:
                SelectAggregateResourceConfig483Example:
                  summary: Default SelectAggregateResourceConfig 483
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectAggregateResourceConfigRequest'
      parameters:
      - name: Limit
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.SelectAggregateResourceConfig
      summary: Amazon Config Select Aggregate Resource Config
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.SelectAggregateResourceConfig'
