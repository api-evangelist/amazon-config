                  summary: Default PutOrganizationConformancePack 480
                  x-microcks-default: true
                  value: example
        '481':
          description: ResourceInUseException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInUseException'
              examples:
                PutOrganizationConformancePack481Example:
                  summary: Default PutOrganizationConformancePack 481
                  x-microcks-default: true
                  value: example
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                PutOrganizationConformancePack482Example:
                  summary: Default PutOrganizationConformancePack 482
                  x-microcks-default: true
                  value: example
        '483':
          description: OrganizationAccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccessDeniedException'
              examples:
                PutOrganizationConformancePack483Example:
                  summary: Default PutOrganizationConformancePack 483
                  x-microcks-default: true
                  value: example
        '484':
          description: InsufficientPermissionsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientPermissionsException'
              examples:
                PutOrganizationConformancePack484Example:
                  summary: Default PutOrganizationConformancePack 484
                  x-microcks-default: true
                  value: example
        '485':
          description: OrganizationConformancePackTemplateValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationConformancePackTemplateValidationException'
              examples:
                PutOrganizationConformancePack485Example:
                  summary: Default PutOrganizationConformancePack 485
