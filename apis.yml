description: >-
  AWS Config provides a detailed view of the configuration of AWS resources in your AWS account. This includes how the
  resources are related to one another and how they were configured in the past, enabling assessment, auditing, and
  evaluation of configurations for compliance and security governance. It records configuration changes continuously,
  evaluates compliance against rules, and supports automated remediation of noncompliant resources.
