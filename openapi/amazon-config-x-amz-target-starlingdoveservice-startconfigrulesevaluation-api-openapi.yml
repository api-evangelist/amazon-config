tags:
- name: '#X Amz Target=StarlingDoveService.StartConfigRulesEvaluation'
paths:
  /#X-Amz-Target=StarlingDoveService.StartConfigRulesEvaluation:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartConfigRulesEvaluation
      description: 'Runs an on-demand evaluation for the specified Config rules against the last known configuration state of the resources. Use StartConfigRulesEvaluation when you want to test that a rule you updated is working as expected. StartConfigRulesEvaluation does not re-record the latest configuration state for your resources. It re-runs an evaluation against the last known state of your resources.


        You can specify up to 25 Config rules per request.


        An existing StartConfigRulesEvaluation call for the specified rules must complete before you can call the API again. If you chose to have Config stream to an Amazon SNS topic, you will receive a ConfigRuleEvaluationStarted notification when the evaluation starts.


        You don''t need to call the StartConfigRulesEvaluation API to run an evaluation for a new rule. When you create a rule, Config evaluates your resources against the rule automatically.


        The StartConfigRulesEvaluation API is useful if you want to run on-demand evaluations, such as the following example:


        You have a custom rule that evaluates your IAM resources every 24 hours.


        You update your Lambda function to add additional conditions to your rule.


        Instead of waiting for the next periodic evaluation, you call the StartConfigRulesEvaluation API.


        Config invokes your Lambda function and evaluates your IAM resources.


        Your custom rule will still run periodic evaluations every 24 hours.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartConfigRulesEvaluationResponse'
              examples:
                StartConfigRulesEvaluation200Example:
                  summary: Default StartConfigRulesEvaluation 200
                  x-microcks-default: true
                  value: {}
        '480':
          description: NoSuchConfigRuleException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoSuchConfigRuleException'
              examples:
                StartConfigRulesEvaluation480Example:
                  summary: Default StartConfigRulesEvaluation 480
                  x-microcks-default: true
                  value: example
        '481':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
              examples:
                StartConfigRulesEvaluation481Example:
                  summary: Default StartConfigRulesEvaluation 481
                  x-microcks-default: true
                  value: example
        '482':
          description: ResourceInUseException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInUseException'
              examples:
                StartConfigRulesEvaluation482Example:
                  summary: Default StartConfigRulesEvaluation 482
                  x-microcks-default: true
                  value: example
        '483':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
              examples:
                StartConfigRulesEvaluation483Example:
                  summary: Default StartConfigRulesEvaluation 483
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConfigRulesEvaluationRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.StartConfigRulesEvaluation
      summary: Amazon Config Start Config Rules Evaluation
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.StartConfigRulesEvaluation'
components:
  schemas:
    ReevaluateConfigRuleNames:
      type: array
      items:
        $ref: '#/components/schemas/ConfigRuleName'
      minItems: 1
      maxItems: 25
    LimitExceededException: {}
    InvalidParameterValueException: {}
    StartConfigRulesEvaluationRequest:
      type: object
      title: StartConfigRulesEvaluationRequest
      properties:
        ConfigRuleNames:
          allOf:
          - $ref: '#/components/schemas/ReevaluateConfigRuleNames'
          - description: The list of names of Config rules that you want to run evaluations for.
      description: <p/>
    NoSuchConfigRuleException: {}
    ResourceInUseException: {}
    StartConfigRulesEvaluationResponse:
      type: object
      properties: {}
      description: The output when you start the evaluation for the specified Config rule.
    ConfigRuleName:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 128
