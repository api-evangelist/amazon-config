security:
- hmac: []
tags:
- name: '#X Amz Target=StarlingDoveService.StartResourceEvaluation'
paths:
  /#X-Amz-Target=StarlingDoveService.StartResourceEvaluation:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartResourceEvaluation
      description: 'Runs an on-demand evaluation for the specified resource to determine whether the resource details will comply with configured Config rules. You can also use it for evaluation purposes. Config recommends using an evaluation context. It runs an execution against the resource details with all of the Config rules in your account that match with the specified proactive mode and resource type.


        Ensure you have the cloudformation:DescribeType role setup to validate the resource type schema.


        You can find the Resource type schema in "Amazon Web Services public extensions" within the CloudFormation registry or with the following CLI commmand: aws cloudformation describe-type --type-name "AWS::S3::Bucket" --type RESOURCE.


        For more information, see Managing extensions through the CloudFormation registry and Amazon Web Services resource and property types reference in the CloudFormation User Guide.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResourceEvaluationResponse'
              examples:
                StartResourceEvaluation200Example:
                  summary: Default StartResourceEvaluation 200
                  x-microcks-default: true
                  value:
                    ResourceEvaluationId: example
        '480':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
              examples:
                StartResourceEvaluation480Example:
                  summary: Default StartResourceEvaluation 480
                  x-microcks-default: true
                  value: example
        '481':
          description: IdempotentParameterMismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotentParameterMismatch'
              examples:
                StartResourceEvaluation481Example:
                  summary: Default StartResourceEvaluation 481
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartResourceEvaluationRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.StartResourceEvaluation
      summary: Amazon Config Start Resource Evaluation
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.StartResourceEvaluation'
components:
  schemas:
    ClientToken:
      type: string
      minLength: 64
      maxLength: 256
    ResourceConfiguration:
      type: string
      minLength: 1
      maxLength: 51200
    ResourceConfigurationSchemaType:
      type: string
      enum:
      - CFN_RESOURCE_SCHEMA
    EvaluationContext:
      type: object
      properties:
        EvaluationContextIdentifier:
          allOf:
          - $ref: '#/components/schemas/EvaluationContextIdentifier'
          - description: A unique EvaluationContextIdentifier ID for an EvaluationContext.
      description: Use EvaluationContext to group independently initiated proactive resource evaluations. For example, CFN Stack. If you want to check just a resource definition, you do not need to provide evaluation context.
    EvaluationMode:
      type: string
      enum:
      - DETECTIVE
      - PROACTIVE
    BaseResourceId:
      type: string
      minLength: 1
      maxLength: 768
    StartResourceEvaluationResponse:
      type: object
      properties:
        ResourceEvaluationId:
          allOf:
          - $ref: '#/components/schemas/ResourceEvaluationId'
          - description: A unique ResourceEvaluationId that is associated with a single execution.
    StringWithCharLimit256:
      type: string
      minLength: 1
      maxLength: 256
    EvaluationTimeout:
      type: integer
      minimum: 0
      maximum: 3600
    InvalidParameterValueException: {}
    IdempotentParameterMismatch: {}
    ResourceDetails:
      type: object
      required:
      - ResourceId
      - ResourceType
      - ResourceConfiguration
      properties:
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/BaseResourceId'
          - description: A unique resource ID for an evaluation.
        ResourceType:
          allOf:
          - $ref: '#/components/schemas/StringWithCharLimit256'
          - description: The type of resource being evaluated.
        ResourceConfiguration:
          allOf:
          - $ref: '#/components/schemas/ResourceConfiguration'
          - description: The resource definition to be evaluated as per the resource configuration schema type.
        ResourceConfigurationSchemaType:
          allOf:
          - $ref: '#/components/schemas/ResourceConfigurationSchemaType'
          - description: '<p>The schema type of the resource configuration.</p> <note> <p>You can find the <a href="https://docs.aws.amazon.com/cloudformation-cli/latest/userguide/resource-type-schema.html">Resource type schema</a>, or <code>CFN_RESOURCE_SCHEMA</code>, in "<i>Amazon Web Services public extensions</i>" within the CloudFormation registry or with the following CLI commmand: <code>aws cloudformation describe-type --type-name "AWS::S3::Bucket" --type RESOURCE</code>.</p> <p>For more information, see <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry.html#registry-view">Managing extensions through the CloudFormation registry</a> and <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-template-resource-type-ref.html">Amazon Web Services resource and property types reference</a> in the CloudFormation User Guide.</p> </note>'
      description: Returns information about the resource being evaluated.
    ResourceEvaluationId:
      type: string
      minLength: 1
      maxLength: 128
    StartResourceEvaluationRequest:
      type: object
      required:
      - ResourceDetails
      - EvaluationMode
      title: StartResourceEvaluationRequest
      properties:
        ResourceDetails:
          allOf:
          - $ref: '#/components/schemas/ResourceDetails'
          - description: Returns a <code>ResourceDetails</code> object.
        EvaluationContext:
          allOf:
          - $ref: '#/components/schemas/EvaluationContext'
          - description: Returns an <code>EvaluationContext</code> object.
        EvaluationMode:
          allOf:
          - $ref: '#/components/schemas/EvaluationMode'
          - description: The mode of an evaluation. The valid values for this API are <code>DETECTIVE</code> and <code>PROACTIVE</code>.
        EvaluationTimeout:
          allOf:
          - $ref: '#/components/schemas/EvaluationTimeout'
          - description: The timeout for an evaluation. The default is 900 seconds. You cannot specify a number greater than 3600. If you specify 0, Config uses the default.
        ClientToken:
          allOf:
          - $ref: '#/components/schemas/ClientToken'
          - description: <p>A client token is a unique, case-sensitive string of up to 64 ASCII characters. To make an idempotent API request using one of these actions, specify a client token in the request.</p> <note> <p>Avoid reusing the same client token for other API requests. If you retry a request that completed successfully using the same client token and the same parameters, the retry succeeds without performing any further actions. If you retry a successful request using the same client token, but one or more of the parameters are different, other than the Region or Availability Zone, the retry fails with an IdempotentParameterMismatch error.</p> </note>
    EvaluationContextIdentifier:
      type: string
      minLength: 1
      maxLength: 128
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
