paths:
  /#X-Amz-Target=StarlingDoveService.PutResourceConfig:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: PutResourceConfig
      description: 'Records the configuration state for the resource provided in the request. The configuration state of a resource is represented in Config as Configuration Items. Once this API records the configuration item, you can retrieve the list of configuration items for the custom resource type using existing Config APIs.


        The custom resource type must be registered with CloudFormation. This API accepts the configuration item registered with CloudFormation.


        When you call this API, Config only stores configuration state of the resource provided in the request. This API does not change or remediate the configuration of the resource.


        Write-only schema properites are not recorded as part of the published configuration item.'
      responses:
        '200':
          description: Success
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                PutResourceConfig480Example:
                  summary: Default PutResourceConfig 480
                  x-microcks-default: true
                  value: example
        '481':
          description: InsufficientPermissionsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientPermissionsException'
              examples:
                PutResourceConfig481Example:
                  summary: Default PutResourceConfig 481
                  x-microcks-default: true
                  value: example
        '482':
          description: NoRunningConfigurationRecorderException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoRunningConfigurationRecorderException'
              examples:
                PutResourceConfig482Example:
                  summary: Default PutResourceConfig 482
                  x-microcks-default: true
                  value: example
        '483':
          description: MaxActiveResourcesExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaxActiveResourcesExceededException'
              examples:
                PutResourceConfig483Example:
                  summary: Default PutResourceConfig 483
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutResourceConfigRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.PutResourceConfig
      summary: Amazon Config Put Resource Config
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.PutResourceConfig'
