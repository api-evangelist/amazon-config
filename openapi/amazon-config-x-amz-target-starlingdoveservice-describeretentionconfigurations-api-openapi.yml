paths:
  /#X-Amz-Target=StarlingDoveService.DescribeRetentionConfigurations:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeRetentionConfigurations
      description: 'Returns the details of one or more retention configurations. If the retention configuration name is not specified, this action returns the details for all the retention configurations for that account.


        Currently, Config supports only one retention configuration per region in your account.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeRetentionConfigurationsResponse'
              examples:
                DescribeRetentionConfigurations200Example:
                  summary: Default DescribeRetentionConfigurations 200
                  x-microcks-default: true
                  value:
                    RetentionConfigurations: example
                    NextToken: example
        '480':
          description: InvalidParameterValueException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValueException'
              examples:
                DescribeRetentionConfigurations480Example:
                  summary: Default DescribeRetentionConfigurations 480
                  x-microcks-default: true
                  value: example
        '481':
          description: NoSuchRetentionConfigurationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoSuchRetentionConfigurationException'
              examples:
                DescribeRetentionConfigurations481Example:
                  summary: Default DescribeRetentionConfigurations 481
                  x-microcks-default: true
                  value: example
        '482':
          description: InvalidNextTokenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidNextTokenException'
              examples:
                DescribeRetentionConfigurations482Example:
                  summary: Default DescribeRetentionConfigurations 482
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeRetentionConfigurationsRequest'
      parameters:
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.DescribeRetentionConfigurations
      summary: Amazon Config Describe Retention Configurations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.DescribeRetentionConfigurations'
components:
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    DescribeRetentionConfigurationsRequest:
      type: object
      title: DescribeRetentionConfigurationsRequest
      properties:
        RetentionConfigurationNames:
          allOf:
          - $ref: '#/components/schemas/RetentionConfigurationNameList'
          - description: <p>A list of names of retention configurations for which you want details. If you do not specify a name, Config returns details for all the retention configurations for that account.</p> <note> <p>Currently, Config supports only one retention configuration per region in your account.</p> </note>
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: 'The <code>nextToken</code> string returned on a previous page that you use to get the next page of results in a paginated response. '
    NoSuchRetentionConfigurationException: {}
    NextToken:
      type: string
    RetentionConfigurationList:
      type: array
      items:
        $ref: '#/components/schemas/RetentionConfiguration'
    RetentionConfigurationName:
      type: string
      pattern: '[\w\-]+'
      minLength: 1
      maxLength: 256
    InvalidParameterValueException: {}
    RetentionConfigurationNameList:
      type: array
      items:
        $ref: '#/components/schemas/RetentionConfigurationName'
      minItems: 0
      maxItems: 1
    RetentionPeriodInDays:
      type: integer
      minimum: 30
      maximum: 2557
    DescribeRetentionConfigurationsResponse:
      type: object
      properties:
        RetentionConfigurations:
          allOf:
          - $ref: '#/components/schemas/RetentionConfigurationList'
          - description: Returns a retention configuration object.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: 'The <code>nextToken</code> string returned on a previous page that you use to get the next page of results in a paginated response. '
    InvalidNextTokenException: {}
    RetentionConfiguration:
      type: object
      required:
      - Name
      - RetentionPeriodInDays
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/RetentionConfigurationName'
          - description: The name of the retention configuration object.
        RetentionPeriodInDays:
          allOf:
          - $ref: '#/components/schemas/RetentionPeriodInDays'
          - description: <p>Number of days Config stores your historical information.</p> <note> <p>Currently, only applicable to the configuration item history.</p> </note>
      description: An object with the name of the retention configuration and the retention period in days. The object stores the configuration for data retention in Config.
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
