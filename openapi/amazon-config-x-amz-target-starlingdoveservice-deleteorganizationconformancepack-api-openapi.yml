tags:
- name: '#X Amz Target=StarlingDoveService.DeleteOrganizationConformancePack'
paths:
  /#X-Amz-Target=StarlingDoveService.DeleteOrganizationConformancePack:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeleteOrganizationConformancePack
      description: 'Deletes the specified organization conformance pack and all of the Config rules and remediation actions from all member accounts in that organization.


        Only a management account or a delegated administrator account can delete an organization conformance pack. When calling this API with a delegated administrator, you must ensure Organizations ListDelegatedAdministrator permissions are added.


        Config sets the state of a conformance pack to DELETE_IN_PROGRESS until the deletion is complete. You cannot update a conformance pack while it is in this state.'
      responses:
        '200':
          description: Success
        '480':
          description: NoSuchOrganizationConformancePackException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoSuchOrganizationConformancePackException'
              examples:
                DeleteOrganizationConformancePack480Example:
                  summary: Default DeleteOrganizationConformancePack 480
                  x-microcks-default: true
                  value: example
        '481':
          description: ResourceInUseException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInUseException'
              examples:
                DeleteOrganizationConformancePack481Example:
                  summary: Default DeleteOrganizationConformancePack 481
                  x-microcks-default: true
                  value: example
        '482':
          description: OrganizationAccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccessDeniedException'
              examples:
                DeleteOrganizationConformancePack482Example:
                  summary: Default DeleteOrganizationConformancePack 482
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOrganizationConformancePackRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.DeleteOrganizationConformancePack
      summary: Amazon Config Delete Organization Conformance Pack
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.DeleteOrganizationConformancePack'
