security:
- hmac: []
tags:
- name: '#X Amz Target=StarlingDoveService.StartConfigurationRecorder'
paths:
  /#X-Amz-Target=StarlingDoveService.StartConfigurationRecorder:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartConfigurationRecorder
      description: 'Starts recording configurations of the Amazon Web Services resources you have selected to record in your Amazon Web Services account.


        You must have created at least one delivery channel to successfully start the configuration recorder.'
      responses:
        '200':
          description: Success
        '480':
          description: NoSuchConfigurationRecorderException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoSuchConfigurationRecorderException'
              examples:
                StartConfigurationRecorder480Example:
                  summary: Default StartConfigurationRecorder 480
                  x-microcks-default: true
                  value: example
        '481':
          description: NoAvailableDeliveryChannelException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoAvailableDeliveryChannelException'
              examples:
                StartConfigurationRecorder481Example:
                  summary: Default StartConfigurationRecorder 481
                  x-microcks-default: true
                  value: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConfigurationRecorderRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StarlingDoveService.StartConfigurationRecorder
      summary: Amazon Config Start Configuration Recorder
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=StarlingDoveService.StartConfigurationRecorder'
components:
  schemas:
    NoAvailableDeliveryChannelException: {}
    NoSuchConfigurationRecorderException: {}
    StartConfigurationRecorderRequest:
      type: object
      required:
      - ConfigurationRecorderName
      title: StartConfigurationRecorderRequest
      properties:
        ConfigurationRecorderName:
          allOf:
          - $ref: '#/components/schemas/RecorderName'
          - description: The name of the recorder object that records each configuration change made to the resources.
      description: The input for the <a>StartConfigurationRecorder</a> action.
    RecorderName:
      type: string
      minLength: 1
      maxLength: 256
